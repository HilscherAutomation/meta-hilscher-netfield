# We have a conf and classes directory, add to BBPATH
BBPATH := "${BBPATH}:${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES := "${BBFILES} ${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hilscher-netfield"
BBFILE_PATTERN_hilscher-netfield := "^${LAYERDIR}/"
BBFILE_PRIORITY_hilscher-netfield = "100"

NETFIELD_BASE = '${@os.path.normpath("${LAYERDIR}/")}'

# Append added variable FIRMWARE_VERSION to build configuration output
BUILDCFG_VARS_append += "FIRMWARE_VERSION \
                         KEYS_IMAGE_SIGN_PRIV \
                         KEYS_IMAGE_SIGN_CERT \
                         KEYS_IMAGE_SIGN_CERT_DER"

LAYERSERIES_COMPAT_hilscher-netfield = "dunfell"
