require conf/distro/poky.conf
require conf/distro/include/rust_versions.inc
require include/sanity.inc
require include/fixed_versions.inc
require cve-whitelist.inc
include conf/distro/include/cve-extra-exclusions.inc

# TODO: Newer Uninative versions sometimes cause wic image build errors
#    See:
#      - https://lore.kernel.org/all/CA+chaQcZCV6xUXPMzOO07trMsmx0R7T3_mQxfYWVHwqiK+LTXw@mail.gmail.com/T/#m7e2a819c3f4940a2e2eb44c0d0b79e16c79eddcf
#      - https://patchwork.yoctoproject.org/project/oe-core/patch/20230623093323.4058529-1-Martin.Jansa@gmail.com/
UNINATIVE_VERSION = "3.9"
UNINATIVE_CHECKSUM[aarch64] = "de35708c95c34573af140da910132c3291ba4fd26ebf7b74b755ada432cdf07b"
UNINATIVE_CHECKSUM[i686] = "adac07b08adb88eb26fc7fd87fee0cec9d5be167bf7c5ffd3a549a2a6699c29c"
UNINATIVE_CHECKSUM[x86_64] = "3dd82c3fbdb59e87bf091c3eef555a05fae528eeda3083828f76cd4deaceca8b"

DISTRO = "netiot"
DISTRO_CODENAME = "netFIELDOS"
DISTRO_NAME = "netFIELD OS"
DISTRO_VERSION = "2.5"
ORGANIZATION = "com.hilscher"

DISTRO_FEATURES:append = " systemd acl xattr pam bluez5 zeroconf apparmor polkit audit seccomp security tpm tpm2"
DISTRO_FEATURES:remove = " ptest x11 wayland debuginfod"

# Enable audit support in libpam
# NOTE: audit has a circular dependency when build python bindings as pam and audit is enabled in distro features
#  Dependency chain: audit -> python3 -> util-linux -> libpam -> audit
PACKAGECONFIG:append:pn-libpam = " audit"
PACKAGECONFIG:remove:pn-audit  = "python"

# Make sure license files are copied to any image
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"

# Make sure all user-ids are static
USERADDEXTENSION = "useradd-staticids"
USERADD_UID_TABLES ??= "files/static-user-ids/passwd"
USERADD_GID_TABLES ??= "files/static-user-ids/group"
USERADD_ERROR_DYNAMIC ??= "error"

RUST_VERSION = "1.66.%"
GOVERSION = "1.21.%"
PREFERRED_PROVIDER_go-native ?= "go-binary-native"

VOLATILE_LOG_DIR = "no"

NETIOT_ROOT_OVERLAY ?= "0"
#next line only valid if NETIOT_ROOT_OVERLAY != 1
NETIOT_OVERLAY_DIRS ?= "etc home opt var/lib var/log usr/local var/secrets var/cache"

# Use squashfs as rootfs
IMAGE_FSTYPES ?= "squashfs"

PACKAGE_CLASSES ?= "package_ipk"

VIRTUAL-RUNTIME_dev_manager = "udev"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"

INCOMPATIBLE_LICENSE = "GPL-3.0*"
# Bash 3 is pulled in by reject GPLv3, thus switch to older bash-completions
PREFERRED_VERSION_pn-bash-completion = "1.%"

NETWORK_MANAGER = ""

PACKAGECONFIG:append:pn-networkmanager = " modemmanager"

# Only use openssl in image as TLS library. Ommit using gnutls
#INHERIT_DISTRO:append = " blacklist"
#SKIP_RECIPE[gnutls] = "netfield only uses openssl as TLS / crypto library"
PACKAGECONFIG:remove:pn-curl = "gnutls"
PACKAGECONFIG:append:pn-curl = " openssl"
PACKAGECONFIG:pn-glib-networking = "openssl"

# Set empty hostname, so it is generated on first boot on all platforms
hostname:pn-base-files = ""

# Development images may pull in GPLv3, which is not allowed in our distro, allow them for debugging reasons.
# ATTENTION: These images may not be distributed
ALLOWED_DEBUG_PACKAGES="autoconf:GPL-3.0-only autoconf-dev:GPL-3.0-only \
    binutils:GPL-3.0-only binutils-dev:GPL-3.0-only ccache:GPL-3.0-only \
    ccache-dev:GPL-3.0-only cpp:GPL-3.0-only cpp-symlinks:GPL-3.0-only \
    gcc:GPL-3.0-only gcc-dev:GPL-3.0-only gcc-symlinks:GPL-3.0-only \
    g++:GPL-3.0-only g++-dev:GPL-3.0-only g++-symlinks:GPL-3.0-only \
    gdb:GPL-3.0-only gdb-dev:GPL-3.0-only gdbserver:GPL-3.0-only \
    libbfd:GPL-3.0-only libmpc:GPL-3.0-only libmpc-dev:GPL-3.0-only \
    mpfr:GPL-3.0-only mpfr-dev:GPL-3.0-only \
"
INCOMPATIBLE_LICENSE_EXCEPTIONS:append = " ${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '${ALLOWED_DEBUG_PACKAGES}', '', d)}"

PROFILE_TOOLS_X:pn-packagegroup-core-tools-profile = ""

PACKAGECONFIG:remove:pn-gdb = "readline"
# systemtap fails with ../git/loc2stap.cxx:673:9: error: 'DW_OP_GNU_parameter_ref' was not declared in this scope
SYSTEMTAP:pn-packagegroup-core-tools-profile = ""
