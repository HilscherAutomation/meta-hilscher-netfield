require conf/distro/poky.conf
require include/sanity.inc
require cve-whitelist.inc

DISTRO = "netiot"
DISTRO_CODENAME = "netIOT"
DISTRO_NAME = "netIOT Edge"
DISTRO_VERSION = "2.0"

DISTRO_FEATURES_append = " systemd acl xattr pam bluez5 zeroconf apparmor polkit"
DISTRO_FEATURES_remove = " ptest x11 wayland"

# Make sure license files are copied to any image
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"

# Make sure all user-ids are static
USERADDEXTENSION = "useradd-staticids"
USERADD_UID_TABLES ??= "files/static-user-ids/passwd"
USERADD_GID_TABLES ??= "files/static-user-ids/group"
USERADD_ERROR_DYNAMIC ??= "error"

GOVERSION = "1.14%"

PREFERRED_PROVIDER_zlib = "zlib"
PREFERRED_PROVIDER_zlib-native = "zlib-native"
PREFERRED_PROVIDER_nativesdk-zlib = "nativesdk-zlib"

HILSCHER_SVN_BASEURL ??= "192.168.100.17"
HILSCHER_SVN_USER ??= "SCMCommitter"
HILSCHER_SVN_PSWD ??= "'g3?bZ&fe2d'"
HILSCHER_BITBUCKET_USER ??= "buildmachine:build_machine09"
HOSTTOOLS_append += "svn"

VOLATILE_LOG_DIR = "no"

# Dont allow python2
BBMASK += "poky/recipes-python/python_"

NETIOT_ROOT_OVERLAY ?= "0"
#next line only valid if NETIOT_ROOT_OVERLAY != 1
NETIOT_OVERLAY_DIRS ?= "etc home opt var/lib var/log usr/local"

# Use squashfs as rootfs
IMAGE_FSTYPES ?= "squashfs"

PACKAGE_CLASSES ?= "package_ipk"

VIRTUAL-RUNTIME_dev_manager = "udev"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"

INCOMPATIBLE_LICENSE = "*GPLv3"
# Bash 3 is pulled in by reject GPLv3, thus switch to older bash-completions
PREFERRED_VERSION_pn-bash-completion = "1.%"

NETWORK_MANAGER = ""

#Required for version extraction of netANALYZER tools
HOSTTOOLS_append += "iconv"

PACKAGECONFIG_append_pn-networkmanager += "modemmanager"

# Only use openssl in image as TLS library. Ommit using gnutls
INHERIT_DISTRO_append += "blacklist"
PNBLACKLIST[gnutls] = "netfield only uses openssl as TLS / crypto library"
PACKAGECONFIG_remove_pn-curl += "gnutls"
PACKAGECONFIG_append_pn-curl += "ssl"
PACKAGECONFIG_pn-glib-networking = "openssl"

# Set empty hostname, so it is generated on first boot on all platforms
hostname_pn-base-files = ""

# Development images may pull in GPLv3, which is not allowed in our distro, allow them for debugging reasons.
# ATTENTION: These images may not be distributed
INCOMPATIBLE_LICENSE_pn-gdb = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-gdbserver = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-ccache = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-binutils = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-gcc = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-autoconf = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-mpfr = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
INCOMPATIBLE_LICENSE_pn-libmpc = "${@bb.utils.contains('EXTRA_IMAGE_FEATURES', 'debug-tweaks', '', '*GPLv3', d)}"
PROFILE_TOOLS_X_pn-packagegroup-core-tools-profile = ""

PACKAGECONFIG_remove_pn-gdb += "readline"
# systemtap fails with ../git/loc2stap.cxx:673:9: error: 'DW_OP_GNU_parameter_ref' was not declared in this scope
SYSTEMTAP_pn-packagegroup-core-tools-profile = ""
